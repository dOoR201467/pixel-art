<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Art Studio</title>
    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
</head>

<body>
    <main class="game-window">
        <h1>PIXEL ART</h1>
        <p class="subtitle">★ PIXEL ART STUDIO ★</p>
        <div id="colorDiv">
            <label for="colorPicker">Choose a color:</label>
            <input type="color" id="colorPicker" value="#000000">
        </div>
        <div id="pixel-grid"></div>
        <div id="buttons">
            <button id="clearButton">Clear Grid</button>
            <button id="eraser" class="eraser-button">Eraser On</button>
            <button id="eraserOff" class="eraser-button">Eraser Off</button>
        </div>
    </main>
</body>

</html>
